version: '3.8'

services:
  netsentinel-soc:
    build: .
    container_name: netsentinel-soc
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
